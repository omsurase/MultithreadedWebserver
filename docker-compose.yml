services:
  # Configurable Proxy Server
  proxy-server:
    build: .
    ports:
      - "${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
    command: 
      - "${SERVER_TYPE:-Threadpool}"
      - "${CACHE_TYPE:-LRUCache}"
      - "${PROXY_PORT:-8080}"
      - "${THREAD_COUNT:-25}"
      - "${CACHE_SIZE:-100}"
    container_name: "${CONTAINER_NAME:-proxy-server}"
    restart: unless-stopped
    environment:
      - SERVER_TYPE=${SERVER_TYPE:-Threadpool}
      - CACHE_TYPE=${CACHE_TYPE:-LRUCache}
      - PROXY_PORT=${PROXY_PORT:-8080}
      - THREAD_COUNT=${THREAD_COUNT:-25}
      - CACHE_SIZE=${CACHE_SIZE:-100}

  # Legacy services (kept for backward compatibility, but optional)
  # ThreadPool + LRU Cache (Default)
  proxy-threadpool-lru:
    build: .
    ports:
      - "8080:8080"
    command: ["Threadpool", "LRUCache", "8080", "25", "100"]
    container_name: proxy-threadpool-lru
    restart: unless-stopped
    profiles: ["legacy"]

  # ThreadPool + LFU Cache
  proxy-threadpool-lfu:
    build: .
    ports:
      - "8081:8081"
    command: ["Threadpool", "LFUCache", "8081", "25", "100"]
    container_name: proxy-threadpool-lfu
    restart: unless-stopped
    profiles: ["legacy", "threadpool-lfu"]

  # Semaphore + LRU Cache
  proxy-semaphore-lru:
    build: .
    ports:
      - "8082:8082"
    command: ["Semaphore", "LRUCache", "8082", "30", "150"]
    container_name: proxy-semaphore-lru
    restart: unless-stopped
    profiles: ["legacy", "semaphore-lru"]

  # Semaphore + LFU Cache
  proxy-semaphore-lfu:
    build: .
    ports:
      - "8083:8083"
    command: ["Semaphore", "LFUCache", "8083", "30", "150"]
    container_name: proxy-semaphore-lfu
    restart: unless-stopped
    profiles: ["legacy", "semaphore-lfu"]

  # High Performance Configuration
  proxy-high-perf:
    build: .
    ports:
      - "8090:8090"
    command: ["Threadpool", "LRUCache", "8090", "50", "500"]
    container_name: proxy-high-perf
    restart: unless-stopped
    profiles: ["legacy", "high-perf"]